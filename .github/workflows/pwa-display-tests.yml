name: PWA display regression tests

on:
  push:
    branches:
      - task/T-0085-mobile-landscape-pwa-fullscreen
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'config.js'
      - 'systems/pet-skills.js'
      - 'tests/pet-income-mutation-multiplier.test.js'
      - 'tests/pet-info-page.test.js'
      - 'systems/dice.js'
      - 'script.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'ui/display-controls.js'
      - 'ui/guild.js'
      - 'services/cloud-save.js'
      - 'guild.css'
      - 'tests/guild-main-interface.test.mjs'
      - 'tests/guild-daily-quests.test.mjs'
      - 'tests/guild-leaderboard.test.mjs'
      - 'tests/guild-settings.test.mjs'
      - 'tests/guild-announcements.test.mjs'
      - 'tests/guild-member-management.test.mjs'
      - 'docs/migrations/20261125210321_guild_settings.sql'
      - 'docs/migrations/20261125212100_guild_name_limit_16.sql'
      - 'docs/migrations/20261125213600_guild_announcements.sql'
      - 'docs/migrations/20261125214100_guild_member_management.sql'
      - 'docs/migrations/20261125124301_guild_leaderboard.sql'
      - 'tests/guild-foundation-authorization.test.mjs'
      - 'tests/sql/guild-foundation-behavior.sql'
      - 'docs/migrations/20261125201831_guild_review_application_null_role_guard.sql'
      - 'docs/migrations/20261125093419_guild_daily_quests_xp.sql'
      - 'docs/migrations/20261125093530_guild_daily_quests_xp_hardening.sql'
      - 'docs/migrations/20261125094852_guild_daily_quests_membership_boundary.sql'
      - 'docs/migrations/20261125101918_guild_repeatable_daily_quests.sql'
      - 'docs/migrations/20261126120000_guild_level_rewards_mailbox.sql'
      - 'tests/guild-level-rewards-mailbox.test.mjs'
      - 'tests/guild-cosmetics.test.mjs'
      - 'docs/migrations/20261127000000_guild_cosmetics.sql'
      - 'tests/guild-search-visibility.test.mjs'
      - 'tests/inventory-selection-visual.test.mjs'
      - 'docs/migrations/20261126123600_guild_search_members_can_browse.sql'
      - 'ui/inventory.js'
      - 'tests/pwa-display-controls.test.mjs'
      - 'systems/global-boost.js'
      - 'tests/global-boost-homepage-render.test.mjs'
      - '.github/workflows/pwa-display-tests.yml'

jobs:
  pwa-display:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PWA display tests
        run: node --test tests/global-boost-homepage-render.test.mjs tests/pwa-display-controls.test.mjs tests/pet-income-mutation-multiplier.test.js tests/pet-info-page.test.js tests/guild-main-interface.test.mjs tests/guild-daily-quests.test.mjs tests/guild-foundation-authorization.test.mjs tests/guild-settings.test.mjs tests/guild-announcements.test.mjs tests/guild-member-management.test.mjs tests/guild-level-rewards-mailbox.test.mjs tests/guild-search-visibility.test.mjs tests/guild-cosmetics.test.mjs tests/inventory-selection-visual.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check config.js
          node --check systems/pet-skills.js
          node --check systems/dice.js
          node --check ui/display-controls.js
          node --check ui/guild.js
          node --check ui/inventory.js
          node --check services/cloud-save.js
          node --check sw.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
