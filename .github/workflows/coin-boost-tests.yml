name: Coin boost regression tests

on:
  push:
    branches:
      - work/chazi
      - integrate/t-0022-global-coin-boost
      - task/T-0023-pet-sale-sort-and-boost-timer
    paths:
      - 'systems/coin-boost.js'
      - 'systems/global-boost.js'
      - 'systems/pet-income.js'
      - 'admin/ui-bindings.js'
      - 'tests/**'
      - '.github/workflows/coin-boost-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'systems/coin-boost.js'
      - 'systems/global-boost.js'
      - 'systems/pet-income.js'
      - 'admin/ui-bindings.js'
      - 'tests/**'
      - '.github/workflows/coin-boost-tests.yml'
  workflow_dispatch:

jobs:
  coin-boost:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run coin boost regression tests
        run: node --test tests/global-coin-boost-activity.test.js tests/admin-coin-boost-ui.test.js tests/coin-boost-timestamp.test.js tests/pet-sale-sort.test.js tests/global-announcements-threshold.test.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
