name: Coin boost regression tests

on:
  push:
    branches:
      - work/chazi
      - integrate/t-0022-global-coin-boost
    paths:
      - 'systems/coin-boost.js'
      - 'systems/global-boost.js'
      - 'systems/pet-income.js'
      - 'admin/ui-bindings.js'
      - 'tests/**'
      - '.github/workflows/coin-boost-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'systems/coin-boost.js'
      - 'systems/global-boost.js'
      - 'systems/pet-income.js'
      - 'admin/ui-bindings.js'
      - 'tests/**'
      - '.github/workflows/coin-boost-tests.yml'
  workflow_dispatch:

jobs:
  coin-boost:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run coin boost regression tests
        run: node --test tests/global-coin-boost-activity.test.js tests/admin-coin-boost-ui.test.js
