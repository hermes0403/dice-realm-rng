name: Auto-roll watchdog regression tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'systems/dice.js'
      - 'tests/auto-roll-watchdog.test.js'
      - 'tests/lifecycle-regression.test.js'
      - '.github/workflows/auto-roll-watchdog-tests.yml'

jobs:
  auto-roll-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run auto-roll regression tests
        run: node --test tests/auto-roll-watchdog.test.js tests/lifecycle-regression.test.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
