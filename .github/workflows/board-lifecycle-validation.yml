name: Board lifecycle validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'board/**'
      - 'scripts/validate-board.mjs'
      - 'tests/board-lifecycle.test.mjs'
      - '.github/workflows/board-lifecycle-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'board/**'
      - 'scripts/validate-board.mjs'
      - 'tests/board-lifecycle.test.mjs'
      - '.github/workflows/board-lifecycle-validation.yml'

jobs:
  board-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Board task files
        run: node scripts/validate-board.mjs
      - name: Test Board lifecycle validator
        run: node --test tests/board-lifecycle.test.mjs
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
