name: Pet trading multi-offer regression tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'script.js'
      - 'services/pet-trading-search.js'
      - 'style.css'
      - 'docs/database/pet-trading-multi-offer.sql'
      - 'tests/pet-trading-multi-offer.test.js'
      - '.github/workflows/pet-trading-multi-offer-tests.yml'

jobs:
  pet-trading-multi-offer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check trade service syntax
        run: node --check services/pet-trading-search.js
      - name: Run multi-offer regression tests
        run: node --test tests/pet-trading-multi-offer.test.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
