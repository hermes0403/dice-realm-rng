name: Cloud save rollback tests

on:
  push:
    branches: [main, task/T-0086-cloud-save-rollback-guard]
    paths:
      - 'services/cloud-save.js'
      - 'services/account-actions.js'
      - 'script.js'
      - 'tests/**'
      - 'docs/game-save-delta-sync-locked-dice.sql'
      - '.github/workflows/cloud-save-rollback-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/cloud-save.js'
      - 'services/account-actions.js'
      - 'script.js'
      - 'tests/**'
      - 'docs/game-save-delta-sync-locked-dice.sql'
      - '.github/workflows/cloud-save-rollback-tests.yml'
  workflow_dispatch:

jobs:
  cloud-save-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check patch whitespace
        run: git diff --check
      - name: Check JavaScript syntax
        run: node --input-type=module --check < services/cloud-save.js && node --input-type=module --check < script.js
      - name: Run focused save and logout regression tests
        run: node --test tests/local-save-cloud-conflict.test.js tests/cloud-save-pet-authority.test.js tests/account-logout-cloud-flush.test.js
      - name: Run full Node regression suite (known unrelated baseline failures are non-blocking)
        run: node --test tests/*.test.js
        continue-on-error: true
