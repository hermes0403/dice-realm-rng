name: AI simulation contract tests
on:
  pull_request:
    paths:
      - 'admin/player-management.js'
      - 'backend/edge-functions/dice-rng-ai-admin/**'
      - 'docs/database/20261124_t0127_ai_*.sql'
      - 'tests/t0127-ai-simulation-contract.test.mjs'
      - '.github/workflows/ai-simulation-contract-tests.yml'
  push:
    branches:
      - 'task/T-0127-ai-player-simulation'
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/t0127-ai-simulation-contract.test.mjs
