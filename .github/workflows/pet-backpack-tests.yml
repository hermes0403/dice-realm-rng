name: Pet backpack and auto-sell regression tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'ui/inventory.js'
      - 'systems/dice.js'
      - 'systems/pets.js'
      - 'tests/pet-backpack-sort-and-auto-sell.test.js'
      - '.github/workflows/pet-backpack-tests.yml'

jobs:
  pet-backpack-and-auto-sell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run pet backpack and auto-sell tests
        run: node --test tests/pet-backpack-sort-and-auto-sell.test.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
