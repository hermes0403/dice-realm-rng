name: Admin navigation tests

on:
  push:
    branches:
      - task/T-0037-admin-panel-navigation-v2
    paths:
      - 'admin/navigation.js'
      - 'index.html'
      - 'style.css'
      - 'tests/admin-navigation.test.js'
      - '.github/workflows/admin-navigation-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'admin/navigation.js'
      - 'index.html'
      - 'style.css'
      - 'tests/admin-navigation.test.js'
      - '.github/workflows/admin-navigation-tests.yml'

jobs:
  admin-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run admin navigation tests
        run: node --test tests/admin-navigation.test.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
