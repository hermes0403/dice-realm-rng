name: Achievement persistence regression tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'core/game-state.js'
      - 'systems/progression.js'
      - 'tests/achievement-current-progress.test.mjs'
      - 'ui/gloves.js'
      - 'tests/achievement-persistence.test.js'
      - 'board/T-0024-achievement-unlock-persistence.md'
      - 'board/README.md'
      - '.github/workflows/achievement-persistence-tests.yml'

jobs:
  achievement-persistence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run achievement persistence tests
        run: node --test tests/achievement-persistence.test.js tests/achievement-current-progress.test.mjs
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
