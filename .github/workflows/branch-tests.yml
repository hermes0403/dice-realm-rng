name: Branch tests

on:
  push:
    branches:
      - work/chazi
  pull_request:
    branches:
      - work/chazi

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full Node test suite
        run: node --test tests/*.test.js

      - name: Check JavaScript syntax for changed services
        run: |
          for file in services/auth.js services/cloud-save.js services/presence.js services/visit-tracking.js systems/weather.js systems/global-boost.js systems/leaderboards.js admin/pet-odds.js script.js; do
            node --check "$file"
          done

      - name: Check changed commit whitespace
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check "${{ github.event.before }}" HEAD
          fi
