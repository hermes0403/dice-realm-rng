name: Presence and cloud sync regression tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/presence.js'
      - 'services/cloud-save.js'
      - 'services/account-actions.js'
      - 'systems/dice.js'
      - 'admin/player-management.js'
      - 'tests/presence-heartbeat.test.js'
      - 'tests/cloud-sync-lifecycle.test.js'
      - 'tests/roll-local-persistence.test.js'
      - '.github/workflows/presence-cloud-sync-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'services/presence.js'
      - 'services/cloud-save.js'
      - 'services/account-actions.js'
      - 'systems/dice.js'
      - 'admin/player-management.js'
      - 'tests/presence-heartbeat.test.js'
      - 'tests/cloud-sync-lifecycle.test.js'
      - 'tests/roll-local-persistence.test.js'
      - '.github/workflows/presence-cloud-sync-tests.yml'

jobs:
  presence-cloud-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run presence, local-save and cloud-sync regression tests
        run: >-
          node --test
          tests/presence-heartbeat.test.js
          tests/cloud-sync-lifecycle.test.js
          tests/roll-local-persistence.test.js
          tests/auto-roll-watchdog.test.js
          tests/lifecycle-regression.test.js
          tests/cloud-save-pet-authority.test.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
