name: Focused game regression tests

on:
  push:
    branches:
      - work/chazi
    paths:
      - 'services/auth.js'
      - 'script.js'
      - 'tests/google-oauth.test.js'
      - 'tests/dice-roll-save.test.js'
      - 'systems/dice.js'
      - 'services/cloud-save.js'
      - '.github/workflows/google-oauth-tests.yml'
  pull_request:
    branches:
      - work/chazi
    paths:
      - 'services/auth.js'
      - 'script.js'
      - 'tests/google-oauth.test.js'
      - 'tests/dice-roll-save.test.js'
      - 'systems/dice.js'
      - '.github/workflows/google-oauth-tests.yml'

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authentication and entrypoint syntax
        run: |
          node --check services/auth.js
          node --check script.js
          node --check systems/dice.js
          node --check services/cloud-save.js
          node --check tests/dice-roll-save.test.js
      - name: Check whitespace for the complete task diff
        run: git diff --check 3b1d1bccde3f986a87f5baa87988cbed9784b20a...HEAD
      - name: Run focused regression tests
        run: node --test tests/google-oauth.test.js tests/dice-roll-save.test.js
