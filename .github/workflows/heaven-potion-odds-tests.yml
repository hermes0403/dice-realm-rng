name: Heaven Potion odds and full regression tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/equipment.js'
      - 'script.js'
      - 'index.html'
      - 'sw.js'
      - 'systems/dice.js'
      - 'systems/glitch-dice.js'
      - 'systems/heaven-potion-odds.js'
      - 'tests/heaven-potion-odds.test.mjs'
      - '.github/workflows/heaven-potion-odds-tests.yml'

jobs:
  heaven-potion-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete Node test suite
        run: node --test tests/*.test.js tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check systems/dice.js
          node --check systems/glitch-dice.js
          node --check systems/heaven-potion-odds.js
          node --check data/equipment.js
          node --check sw.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
