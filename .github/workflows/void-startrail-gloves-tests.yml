name: Void and Startrail glove regression tests

on:
  push:
    branches:
      - task/T-0102-void-startrail-gloves
  pull_request:
    branches:
      - main
    paths:
      - 'data/dice.js'
      - 'core/game-state.js'
      - 'ui/gloves.js'
      - 'ui/equipment.js'
      - 'script.js'
      - 'index.html'
      - 'sw.js'
      - 'docs/migrations/20261117111800_t0102_add_void_startrail_gloves.sql'
      - 'tests/void-startrail-gloves.test.mjs'
      - '.github/workflows/void-startrail-gloves-tests.yml'

jobs:
  void-startrail-gloves:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run glove and related regression tests
        run: node --test tests/void-startrail-gloves.test.mjs tests/time-crystal-ui.test.mjs tests/achievement-persistence.test.js
      - name: Check JavaScript syntax
        run: |
          node --check data/dice.js
          node --check core/game-state.js
          node --check ui/gloves.js
          node --check ui/equipment.js
          node --check script.js
          node --check sw.js
      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
